name: Publish to MCP Registry
on:
  schedule:
    - cron: '17 * * * *'          # off the top of the hour; GitHub drops queued jobs under load
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute, validate and show what would change; publish nothing, commit nothing
        type: boolean
        default: false
permissions:
  contents: write                 # commit the published manifest back to main
  id-token: write                 # mcp-publisher login github-oidc
concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher v1.8.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tgz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - run: .github/scripts/publish-mcp-registry.sh
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
